# End-to-end offchain demo: orchestrator + a cap that returns JSON and
# publishes stamped chunks to a stub Bee.
#
# The orchestrator service is defined once in ../compose.orchestrator.yml and
# pulled in with `extends`. Once up, send a file from the host:
#   docker compose up -d --build
#   uv run client.py --discovery https://localhost:8935/discovery sample.bin

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.yml
      service: orchestrator

  bee:
    image: swarm-publish-demo:local
    pull_policy: build
    build:
      context: ..
      dockerfile: swarm-publish-demo/Dockerfile
    container_name: example_apps_swarm_bee
    entrypoint: ["python", "-m", "livepeer_swarm.stub"]
    command:
      - --host=0.0.0.0
      - --port=1633

  app:
    image: swarm-publish-demo:local
    pull_policy: build
    build:
      context: ..
      dockerfile: swarm-publish-demo/Dockerfile
    container_name: example_apps_swarm_publish_demo
    environment:
      BEE_URL: http://bee:1633
    depends_on:
      orchestrator:
        condition: service_healthy
      bee:
        condition: service_started
    command:
      - --host=0.0.0.0
      - --orchestrator=https://orchestrator:8935
      - --orchSecret=abcdef
      - --runner-url=http://app:8989
