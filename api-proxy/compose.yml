# Local offchain example: local orchestrator + pinned fal queue adapters
# attached statically through runners.json (-liveRunnerConfig).
#
# The operator-held FAL_KEY belongs in .env.local. Run with:
#   docker compose --env-file .env.local up -d --build
#   uv run client.py run flux-schnell --input-json examples/flux-schnell.json

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.static.yml
      service: orchestrator
    volumes:
      - ./deployments/local-offchain-flux/generated/runners.json:/config/runners.json:ro

  app:
    image: ghcr.io/livepeer/runner-example-api-proxy:latest
    pull_policy: build
    build: .
    container_name: example_apps_api_proxy
    environment:
      # The key stays in the adapter; it is never accepted from callers.
      - FAL_KEY=${FAL_KEY:?set FAL_KEY in .env.local (copy .env.example)}
