[project]
name = "livepeer-hello-world"
version = "0.1.0"
description = "Hello-world example app for the Livepeer network."
requires-python = ">=3.12"
dependencies = [
    "livepeer-gateway",
]

# livepeer-gateway is not on PyPI yet; pull it from the branch.
# ja/live-runner predates the current live-runner payment protocol: it expects a
# `payment_url` in the 402 challenge, while orchestrators now send `orchestrator`
# and the client builds the payment session itself.
[tool.uv.sources]
livepeer-gateway = { git = "https://github.com/eliteprox/livepeer-python-gateway", branch = "jm/live-runner-session-payments" }
