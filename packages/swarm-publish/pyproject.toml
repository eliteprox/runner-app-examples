[project]
name = "livepeer-swarm-publish"
version = "0.1.0"
description = "Optional Swarm publish side effect for Livepeer live-runner caps."
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "eth-account",
    "eth-hash[pycryptodome]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livepeer_swarm"]
