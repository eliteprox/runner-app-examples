[project]
name = "livepeer-ffmpeg"
version = "0.1.0"
description = "Multi-op ffmpeg tool example app (tool -> agent) for the Livepeer network."
requires-python = ">=3.12"
dependencies = [
    "livepeer-gateway>=1.0.0",
    "livepeer-gateway-client",
    "mcp",  # for mcp_server.py — the Claude (MCP) integration
]

# livepeer-gateway-client isn't on PyPI yet; pin the Clearinghouse Builder API client.
[tool.uv.sources]
livepeer-gateway-client = { git = "https://github.com/pymthouse/livepeer-gateway-client", rev = "8035d8514bf5048f380e48b98849472492de2e27" }
