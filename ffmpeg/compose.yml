# End-to-end offchain demo: orchestrator + a multi-op ffmpeg tool app.
#
# The orchestrator service is defined once in ../compose.orchestrator.yml and
# pulled in with `extends`; this file only adds the app. Once up, call it from
# the host with the SDK:
#   docker compose up -d --build
#   uv run client.py --op transcode --height 480 --input clip.mp4 --output out.mp4
# CPU (libx264) by default; see the README to enable GPU (h264_nvenc).

services:
  orchestrator:
    extends:
      file: ../compose.orchestrator.yml
      service: orchestrator

  app:
    # `up` always builds; `--pull always` runs the published image instead.
    image: ghcr.io/livepeer/runner-example-ffmpeg:latest
    pull_policy: build
    build: .
    container_name: example_apps_ffmpeg
    # Wait for the orchestrator's healthcheck so registration doesn't race its boot.
    depends_on:
      orchestrator:
        condition: service_healthy
    command:
      - --host=0.0.0.0
      - --orchestrator=https://orchestrator:8935
      - --orchSecret=abcdef
      - --runner-url=http://app:5000
    # GPU: layer compose.gpu.yml — no edits here (see that file / README).
