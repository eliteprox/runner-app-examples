# Optional private, operator-funded Bee for retrieval. No publisher key is mounted.
services:
  bee:
    image: ethersphere/bee:2.8.3
    restart: unless-stopped
    command: [start]
    environment:
      BEE_API_ADDR: ':1633'
      BEE_FULL_NODE: 'false'
      BEE_SWAP_ENABLE: 'true'
      BEE_BLOCKCHAIN_RPC_ENDPOINT: ${GNOSIS_RPC_URL:-https://rpc.gnosischain.com}
      BEE_PASSWORD_FILE: /run/secrets/bee_password
      BEE_DATA_DIR: /home/bee/.bee
      BEE_VERBOSITY: info
    ports: ['127.0.0.1:11634:1633']
    volumes: [bee-data:/home/bee/.bee]
    secrets: [bee_password]
secrets:
  bee_password:
    file: ${BEE_PASSWORD_PATH:?set operator Bee password path}
volumes:
  bee-data:
